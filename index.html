<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>经济标 · 登录</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-page">
    <header class="top-bar">
      <div class="top-bar__inner">
        <div class="top-bar__brand">
          <img
            class="top-bar__logo"
            src="assets/logo.png"
            width="18"
            height="21"
            alt="广联达"
          />
          <img
            class="top-bar__title-img"
            src="assets/title.png"
            width="120"
            height="16"
            alt="智能辅助评标"
          />
          <span class="top-bar__project"
            >北京信息科技大学新校区建设工程第一教学组团项目幕墙工程</span
          >
        </div>
        <nav class="top-bar__actions">
          <a href="#" class="doc-link">
            <img
              class="doc-link__icon"
              src="assets/icon-bid-doc.png"
              width="14"
              height="16"
              alt=""
            />
            招标文件
          </a>
          <a href="#" class="doc-link">
            <img
              class="doc-link__icon"
              src="assets/icon-tender-doc.png"
              width="14"
              height="16"
              alt=""
            />
            投标文件
          </a>
        </nav>
      </div>
    </header>

    <main class="login-main">
      <section class="login-card" aria-labelledby="login-title">
        <h1 id="login-title" class="login-card__title">经济标 · 登录</h1>
        <p class="login-card__desc">登录后进入智能辅助评标 / 推荐质询单位</p>
        <form class="login-form" id="login-form" novalidate>
          <label class="login-field">
            <span class="login-field__label">账号</span>
            <input
              class="login-field__input"
              type="text"
              name="account"
              autocomplete="username"
              placeholder="请输入账号"
              required
            />
          </label>
          <label class="login-field">
            <span class="login-field__label">密码</span>
            <input
              class="login-field__input"
              type="password"
              name="password"
              autocomplete="current-password"
              placeholder="请输入密码"
              required
            />
          </label>
          <button type="submit" class="btn btn--login-submit">登录</button>
        </form>
      </section>
    </main>

    <script>
      document.getElementById("login-form").addEventListener("submit", function (e) {
        e.preventDefault();
        window.location.href = "home.html";
      });
    </script>
  </body>
</html>
