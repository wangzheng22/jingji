<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>经济标 · 智能辅助评标 - 推荐质询单位</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div
      id="scan-overlay"
      class="scan-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="scan-overlay-title"
      hidden
    >
      <div class="scan-overlay__panel">
        <p id="scan-overlay-title" class="scan-overlay__title">智能评审扫描中</p>
        <p class="scan-overlay__subtitle">共 50 家投标单位，逐个校验…</p>
        <p class="scan-overlay__progress">
          <span id="scan-progress-curr">0</span> / <span id="scan-progress-total">50</span>
        </p>
        <div class="scan-overlay__list" id="scan-list"></div>
      </div>
    </div>

    <header class="top-bar">
      <div class="top-bar__inner">
        <div class="top-bar__brand">
          <img
            class="top-bar__logo"
            src="assets/logo.png"
            width="18"
            height="21"
            alt="广联达"
          />
          <img
            class="top-bar__title-img"
            src="assets/title.png"
            width="120"
            height="16"
            alt="智能辅助评标"
          />
          <span class="top-bar__project"
            >北京信息科技大学新校区建设工程第一教学组团项目幕墙工程</span
          >
        </div>
        <nav class="top-bar__actions">
          <a href="#" class="doc-link">
            <img
              class="doc-link__icon"
              src="assets/icon-bid-doc.png"
              width="14"
              height="16"
              alt=""
            />
            招标文件
          </a>
          <a href="#" class="doc-link">
            <img
              class="doc-link__icon"
              src="assets/icon-tender-doc.png"
              width="14"
              height="16"
              alt=""
            />
            投标文件
          </a>
        </nav>
      </div>
    </header>

    <main class="page">
      <section class="alert-card">
        <div class="alert-card__bg" aria-hidden="true"></div>
        <img
          class="alert-card__wave"
          src="assets/alert-card-wave.png?v=8"
          width="1024"
          height="148"
          alt=""
          aria-hidden="true"
        />
        <div class="alert-card__inner">
          <div class="alert-card__icon" aria-hidden="true">
            <img
              class="alert-card__icon-img"
              src="assets/alert-icon.png"
              width="88"
              height="93"
              alt=""
            />
          </div>
          <div class="alert-card__main">
            <p class="alert-card__headline" id="alert-inquiry-headline">
              建议质询单位
              <strong class="highlight-num" id="alert-inquiry-count">0</strong>
              家<span
                id="alert-selected-suffix"
                class="alert-card__selected-suffix"
                hidden
                >，您已选 <strong id="alert-selected-inline">0</strong> 家</span
              >
            </p>
            <button type="button" class="btn btn--primary">
              <span id="btn-primary-label">一键质询</span>
              <span class="btn--primary__icon-wrap" aria-hidden="true">
                <img
                  class="btn--primary__icon"
                  src="assets/btn-inquiry-icon.png"
                  width="14"
                  height="14"
                  alt=""
                />
              </span>
            </button>
          </div>
          <div class="alert-card__text-card">
            <p class="alert-card__reason-label">推荐理由：</p>
            <p
              class="alert-card__reason-body"
              id="alert-reason-body"
              data-full-text="严重异常清单对应报价合计占投标报价总额比重=5%，各投标单位严重异常清单报价合计143万~213万"
              aria-live="polite"
            >严重异常清单对应报价合计占投标报价总额比重=5%，各投标单位严重异常清单报价合计143万~213万</p>
          </div>
        </div>
      </section>

      <section class="summary-panel">
        <div class="summary-panel__header">
          <h1 class="summary-panel__title">
            推荐质询单位
            <span class="summary-panel__count">
              <span id="summary-total">共 5 家</span>
              <span class="summary-panel__count-sep">，</span>
              <span id="summary-selected">已选 5 家</span>
            </span>
          </h1>
          <button type="button" class="btn btn--outline">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path
                d="M8 2v8m0 0l3-3m-3 3L5 7M3 12v1a1 1 0 001 1h8a1 1 0 001-1v-1"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
              />
            </svg>
            异常清单明细
          </button>
        </div>

        <div class="bid-table-shell">
          <div class="bid-table-scroll" id="bid-table-scroll">
            <div class="bid-table-head">
              <span class="col col--check">
                <input
                  type="checkbox"
                  id="check-all"
                  aria-label="全选当前页"
                />
              </span>
              <span class="col col--name">投标单位</span>
              <span class="col col--total">报价总额</span>
              <span class="col col--abnormal">
                <button
                  type="button"
                  class="th-sort"
                  id="sort-abnormal"
                  data-sort="abnormal"
                  aria-sort="none"
                >
                  <span>异常金额</span>
                  <svg
                    class="sort-ico"
                    viewBox="0 0 16 16"
                    aria-hidden="true"
                  >
                    <path class="up" d="M8 3.2 11.2 7H4.8Z" />
                    <path class="down" d="M4.8 9h6.4L8 12.8Z" />
                  </svg>
                </button>
              </span>
              <span class="col col--issues">异常类型统计</span>
              <span class="col col--breakdown">异常分部统计</span>
            </div>
            <div class="bid-table-body" id="bidder-rows"></div>
          </div>
          <footer class="table-footer">
            <p class="table-footer__total">
              共 <span id="total-count">0</span> 条数据
            </p>
            <div class="table-footer__right">
              <label class="page-size">
                每页
                <select id="page-size" aria-label="每页条数">
                  <option value="10">10</option>
                  <option value="20" selected>20</option>
                  <option value="50">50</option>
                  <option value="100">100</option>
                </select>
                条
              </label>
              <nav class="pagination" id="pagination" aria-label="分页"></nav>
            </div>
          </footer>
        </div>
      </section>
    </main>

    <dialog
      id="inquiry-dialog"
      class="inquiry-dialog"
      aria-labelledby="inquiry-dialog-title"
    >
      <div class="inquiry-dialog__panel">
        <header class="inquiry-dialog__head">
          <div class="inquiry-dialog__head-text">
            <h2 id="inquiry-dialog-title">质询对象</h2>
          </div>
          <button
            type="button"
            class="inquiry-dialog__close"
            id="inquiry-dialog-close"
            aria-label="关闭"
          >
            ×
          </button>
        </header>
        <div class="inquiry-dialog__toolbar">
          <p class="inquiry-dialog__summary" id="inquiry-dialog-summary"></p>
          <button
            type="button"
            class="inquiry-dialog__expand-toggle"
            id="inquiry-toggle-expand"
          >
            全部收起
          </button>
        </div>
        <div class="inquiry-dialog__body" id="inquiry-dialog-list"></div>
        <footer class="inquiry-dialog__foot">
          <button
            type="button"
            class="inquiry-dialog__btn inquiry-dialog__btn--cancel"
            id="inquiry-dialog-cancel"
          >
            取消
          </button>
          <button
            type="button"
            class="inquiry-dialog__btn inquiry-dialog__btn--submit"
            id="inquiry-dialog-submit"
          >
            生成质询函
          </button>
        </footer>
      </div>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
